name: ManaBar
options:
  bundleIdPrefix: com.roshan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

targets:
  ManaBar:
    type: application
    platform: macOS
    sources:
      - path: ManaBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshan.manabar
        PRODUCT_NAME: ManaBar
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: ManaBar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        ENABLE_HARDENED_RUNTIME: NO
